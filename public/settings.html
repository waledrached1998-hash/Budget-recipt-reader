<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Settings</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#6552F5">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5FA;
    --card: #FFFFFF;
    --ink: #16161F;
    --ink-soft: #6E6E85;
    --accent: #6552F5;
    --accent-soft: #EDE9FE;
    --accent-2: #12B886;
    --accent-2-soft: #E1F7EE;
    --line: #EDEDF3;
    --alert: #E5484D;
    --alert-soft: #FDE7E8;
    --radius: 20px;
    --radius-sm: 12px;
    --display: 'Sora', sans-serif;
    --sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg);
    background-image:
      radial-gradient(circle at 12% -6%, rgba(101,82,245,0.14), transparent 42%),
      radial-gradient(circle at 100% 10%, rgba(18,184,134,0.10), transparent 40%);
    color: var(--ink); font-family: var(--sans);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 22px 14px 80px; -webkit-font-smoothing: antialiased;
  }

  .app { width: 100%; max-width: 430px; }

  .hero { padding: 6px 4px 20px; position: relative; }
  .back-link {
    position: absolute; left: 0; top: 6px;
    font-size: 13px; font-weight: 500; color: var(--ink-soft); text-decoration: none;
  }
  .back-link:hover { color: var(--accent); }
  .hero h1 {
    font-family: var(--display); font-size: 28px; font-weight: 700;
    letter-spacing: -0.02em; margin: 26px 0 2px; color: var(--ink);
  }
  .hero .sub { font-size: 13px; color: var(--ink-soft); }

  .card {
    background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(22,22,31,0.04), 0 12px 28px -14px rgba(22,22,31,0.14);
  }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .icon-badge {
    width: 42px; height: 42px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; flex-shrink: 0;
  }
  .icon-badge.violet { background: var(--accent-soft); }
  .icon-badge.mint { background: var(--accent-2-soft); }
  .card-head h2 { font-family: var(--display); font-size: 16.5px; font-weight: 700; color: var(--ink); margin: 0; }

  .item-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 13px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    margin-bottom: 8px; font-size: 14px;
  }
  .item-row .info { display: flex; flex-direction: column; }
  .item-row .amount { font-family: var(--display); font-weight: 600; font-size: 12.5px; color: var(--ink-soft); }
  .item-row button {
    width: auto; background: none; border: none; color: var(--alert);
    font-size: 12px; font-weight: 500; cursor: pointer; padding: 4px 6px;
  }
  .item-row button:hover { text-decoration: underline; }

  .add-row { display: flex; gap: 8px; margin-top: 14px; }
  .add-row input {
    flex: 1; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    background: #FBFBFD; font-family: var(--sans); font-size: 14px; color: var(--ink);
  }
  .add-row input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .add-row button {
    width: auto; padding: 11px 18px; border-radius: 999px; border: none;
    background: var(--accent); color: #fff; font-family: var(--display); font-size: 12.5px; font-weight: 700;
    cursor: pointer;
  }
  .add-row button:hover { opacity: 0.92; }

  .bill-form { margin-top: 14px; }
  .bill-form .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .bill-form input {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    background: #FBFBFD; font-family: var(--sans); font-size: 14px; color: var(--ink); margin-bottom: 8px;
  }
  .bill-form input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 6px 0 12px; font-size: 12.5px; color: var(--ink-soft); }
  .checkbox-row input[type="checkbox"] { width: auto; accent-color: var(--accent); }
  .bill-form button {
    width: 100%; padding: 12px 16px; border-radius: 999px; border: none;
    background: var(--accent); color: #fff; font-family: var(--display); font-size: 13.5px; font-weight: 700;
    cursor: pointer;
  }
  .bill-form button:hover { opacity: 0.92; }

  .status-line { margin-top: 12px; font-size: 12.5px; text-align: center; min-height: 16px; color: var(--ink-soft); font-weight: 500; }
  .status-line.success { color: var(--accent-2); }
  .status-line.error { color: var(--alert); }

  .empty-hint { font-size: 12.5px; color: var(--ink-soft); text-align: center; padding: 10px 0; }
</style>
</head>
<body>

  <div class="app">

    <div class="hero">
      <a class="back-link" href="/">‹ Back</a>
      <h1>Settings</h1>
      <div class="sub">Manage your categories and recurring bills.</div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge violet">🏷️</div>
        <h2>Categories</h2>
      </div>

      <div id="categoryList"></div>
      <div class="empty-hint" id="emptyCategoryHint" style="display:none;">No categories yet — add your first one below.</div>

      <div class="add-row">
        <input type="text" id="newCategoryInput" placeholder="e.g. Subscriptions">
        <button type="button" onclick="addCategory()">+ Add</button>
      </div>

      <div class="status-line" id="categoryStatusLine"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge mint">📄</div>
        <h2>Recurring Bills</h2>
      </div>

      <div id="billList"></div>
      <div class="empty-hint" id="emptyBillHint" style="display:none;">No bills saved yet — add your first one below.</div>

      <div class="bill-form">
        <input type="text" id="newBillName" placeholder="Bill name, e.g. Rent">
        <div class="row-2">
          <input type="number" id="newBillAmount" placeholder="Amount">
          <input type="date" id="newBillDueDate">
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="applyToCurrentMonth">
          <label for="applyToCurrentMonth">Also add to this month's sheet</label>
        </div>
        <button type="button" onclick="addBill()">+ Add Bill</button>
      </div>

      <div class="status-line" id="billStatusLine"></div>
    </div>
  </div>

<script>
  const categoryList = document.getElementById('categoryList');
  const emptyCategoryHint = document.getElementById('emptyCategoryHint');
  const categoryStatusLine = document.getElementById('categoryStatusLine');
  const newCategoryInput = document.getElementById('newCategoryInput');

  function loadCategories() {
    fetch('/categories')
      .then(res => res.json())
      .then(data => renderCategories(data.categories || []))
      .catch(err => {
        categoryStatusLine.textContent = 'Could not load categories.';
        categoryStatusLine.className = 'status-line error';
      });
  }

  function renderCategories(categories) {
    categoryList.innerHTML = '';
    if (categories.length === 0) {
      emptyCategoryHint.style.display = 'block';
      return;
    }
    emptyCategoryHint.style.display = 'none';

    categories.forEach(category => {
      const row = document.createElement('div');
      row.className = 'item-row';

      const label = document.createElement('span');
      label.textContent = category;

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '× remove';
      removeBtn.addEventListener('click', () => removeCategory(category));

      row.appendChild(label);
      row.appendChild(removeBtn);
      categoryList.appendChild(row);
    });
  }

  function addCategory() {
    const category = newCategoryInput.value.trim();
    if (!category) return;

    categoryStatusLine.textContent = 'Adding…';
    categoryStatusLine.className = 'status-line';

    fetch('/categories/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category }),
    })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'added') {
          categoryStatusLine.textContent = 'Added.';
          categoryStatusLine.className = 'status-line success';
          newCategoryInput.value = '';
          loadCategories();
        } else {
          categoryStatusLine.textContent = data.error || 'Could not add category.';
          categoryStatusLine.className = 'status-line error';
        }
      })
      .catch(err => {
        categoryStatusLine.textContent = 'Error: ' + err.message;
        categoryStatusLine.className = 'status-line error';
      });
  }

  function removeCategory(category) {
    categoryStatusLine.textContent = 'Removing…';
    categoryStatusLine.className = 'status-line';

    fetch('/categories/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category }),
    })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'removed') {
          categoryStatusLine.textContent = 'Removed.';
          categoryStatusLine.className = 'status-line success';
          loadCategories();
        } else {
          categoryStatusLine.textContent = data.error || 'Could not remove category.';
          categoryStatusLine.className = 'status-line error';
        }
      })
      .catch(err => {
        categoryStatusLine.textContent = 'Error: ' + err.message;
        categoryStatusLine.className = 'status-line error';
      });
  }

  newCategoryInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addCategory();
  });

  const billList = document.getElementById('billList');
  const emptyBillHint = document.getElementById('emptyBillHint');
  const billStatusLine = document.getElementById('billStatusLine');

  function loadBills() {
    fetch('/bills')
      .then(res => res.json())
      .then(data => renderBills(data.bills || []))
      .catch(err => {
        billStatusLine.textContent = 'Could not load bills.';
        billStatusLine.className = 'status-line error';
      });
  }

  function renderBills(bills) {
    billList.innerHTML = '';
    if (bills.length === 0) {
      emptyBillHint.style.display = 'block';
      return;
    }
    emptyBillHint.style.display = 'none';

    bills.forEach(bill => {
      const row = document.createElement('div');
      row.className = 'item-row';

      const info = document.createElement('div');
      info.className = 'info';

      const nameSpan = document.createElement('span');
      nameSpan.textContent = bill.bill_name;

      const amountSpan = document.createElement('span');
      amountSpan.className = 'amount';
      amountSpan.textContent = Number(bill.amount).toFixed(2);

      info.appendChild(nameSpan);
      info.appendChild(amountSpan);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '× remove';
      removeBtn.addEventListener('click', () => removeBill(bill.bill_name));

      row.appendChild(info);
      row.appendChild(removeBtn);
      billList.appendChild(row);
    });
  }

  function addBill() {
    const name = document.getElementById('newBillName').value.trim();
    const amount = parseFloat(document.getElementById('newBillAmount').value);
    const dueDate = document.getElementById('newBillDueDate').value;
    const applyToCurrentMonth = document.getElementById('applyToCurrentMonth').checked;

    if (!name || isNaN(amount)) {
      billStatusLine.textContent = 'Enter a name and amount first.';
      billStatusLine.className = 'status-line error';
      return;
    }

    const bill = { name, amount };
    if (dueDate) bill.due_date = dueDate;

    billStatusLine.textContent = 'Adding…';
    billStatusLine.className = 'status-line';

    fetch('/bills/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bill, apply_to_current_month: applyToCurrentMonth }),
    })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'added') {
          billStatusLine.textContent = 'Added.';
          billStatusLine.className = 'status-line success';
          document.getElementById('newBillName').value = '';
          document.getElementById('newBillAmount').value = '';
          document.getElementById('newBillDueDate').value = '';
          document.getElementById('applyToCurrentMonth').checked = false;
          loadBills();
        } else {
          billStatusLine.textContent = data.error || 'Could not add bill.';
          billStatusLine.className = 'status-line error';
        }
      })
      .catch(err => {
        billStatusLine.textContent = 'Error: ' + err.message;
        billStatusLine.className = 'status-line error';
      });
  }

  function removeBill(name) {
    billStatusLine.textContent = 'Removing…';
    billStatusLine.className = 'status-line';

    fetch('/bills/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bill: { name } }),
    })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'removed') {
          billStatusLine.textContent = 'Removed.';
          billStatusLine.className = 'status-line success';
          loadBills();
        } else {
          billStatusLine.textContent = data.error || 'Could not remove bill.';
          billStatusLine.className = 'status-line error';
        }
      })
      .catch(err => {
        billStatusLine.textContent = 'Error: ' + err.message;
        billStatusLine.className = 'status-line error';
      });
  }

  loadCategories();
  loadBills();
</script>
</body>
</html>

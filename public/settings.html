<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Settings</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#6552F5">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5FA; --card: #FFFFFF; --ink: #16161F; --ink-soft: #6E6E85;
    --accent: #6552F5; --accent-soft: #EDE9FE; --accent-2: #12B886;
    --line: #EDEDF3; --alert: #E5484D; --radius: 20px; --radius-sm: 12px;
    --display: 'Sora', sans-serif; --sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg);
    background-image: radial-gradient(circle at 12% -6%, rgba(101,82,245,0.14), transparent 42%);
    color: var(--ink); font-family: var(--sans);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 22px 14px 80px; -webkit-font-smoothing: antialiased;
  }
  .app { width: 100%; max-width: 430px; }
  .hero { padding: 6px 4px 18px; position: relative; }
  .back-link { position: absolute; left: 0; top: 6px; font-size: 13px; font-weight: 500; color: var(--ink-soft); text-decoration: none; }
  .back-link:hover { color: var(--accent); }
  .hero h1 { font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 26px 0 0; }

  .tabs {
    display: flex; background: #EDEDF3; border-radius: 999px; padding: 4px;
    margin-bottom: 18px; position: relative;
  }
  .tab {
    flex: 1; text-align: center; padding: 9px 8px; border-radius: 999px;
    font-family: var(--display); font-size: 12.5px; font-weight: 700;
    color: var(--ink-soft); cursor: pointer; user-select: none;
    transition: color 0.15s ease; position: relative; z-index: 1;
  }
  .tab.active { color: #fff; }
  .tab-indicator {
    position: absolute; top: 4px; bottom: 4px; left: 4px;
    width: calc(100% - 8px);
    background: var(--accent); border-radius: 999px;
  }

  .card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: 0 1px 2px rgba(22,22,31,0.04), 0 12px 28px -14px rgba(22,22,31,0.14); }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .icon-badge { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; background: var(--accent-soft); }
  .card-head h2 { font-family: var(--display); font-size: 16.5px; font-weight: 700; margin: 0; }
  .item-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 14px; }
  .item-row button { width: auto; background: none; border: none; color: var(--alert); font-size: 12px; font-weight: 500; cursor: pointer; padding: 4px 6px; }
  .item-row button:hover { text-decoration: underline; }
  .add-row { display: flex; gap: 8px; margin-top: 14px; }
  .add-row input { flex: 1; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); background: #FBFBFD; font-family: var(--sans); font-size: 14px; color: var(--ink); }
  .add-row input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .add-row button { width: auto; padding: 11px 18px; border-radius: 999px; border: none; background: var(--accent); color: #fff; font-family: var(--display); font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .add-row button:hover { opacity: 0.92; }
  .status-line { margin-top: 12px; font-size: 12.5px; text-align: center; min-height: 16px; color: var(--ink-soft); font-weight: 500; }
  .status-line.success { color: var(--accent-2); }
  .status-line.error { color: var(--alert); }
  .empty-hint { font-size: 12.5px; color: var(--ink-soft); text-align: center; padding: 12px 0; }
</style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <a class="back-link" href="/">‹ Back</a>
      <h1>Settings</h1>
    </div>

    <div class="tabs">
      <div class="tab-indicator"></div>
      <div class="tab active">Categories</div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">🏷️</div>
        <h2>Your Categories</h2>
      </div>

      <div id="categoryList"></div>
      <div class="empty-hint" id="emptyCategoryHint" style="display:none;">No categories yet — add your first one below.</div>

      <div class="add-row">
        <input type="text" id="newCategoryInput" placeholder="e.g. Subscriptions">
        <button type="button" onclick="addCategory()">+ Add</button>
      </div>

      <div class="status-line" id="categoryStatusLine"></div>
    </div>
  </div>

<script>
  const categoryList = document.getElementById('categoryList');
  const emptyCategoryHint = document.getElementById('emptyCategoryHint');
  const categoryStatusLine = document.getElementById('categoryStatusLine');
  const newCategoryInput = document.getElementById('newCategoryInput');

  function loadCategories() {
    fetch('/categories')
      .then(res => res.json())
      .then(data => renderCategories(data.categories || []))
      .catch(() => {
        categoryStatusLine.textContent = 'Could not load categories.';
        categoryStatusLine.className = 'status-line error';
      });
  }

  function renderCategories(categories) {
    categoryList.innerHTML = '';
    if (categories.length === 0) {
      emptyCategoryHint.style.display = 'block';
      return;
    }
    emptyCategoryHint.style.display = 'none';

    categories.forEach(category => {
      const row = document.createElement('div');
      row.className = 'item-row';

      const label = document.createElement('span');
      label.textContent = category;

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '× remove';
      removeBtn.addEventListener('click', () => removeCategory(category));

      row.appendChild(label);
      row.appendChild(removeBtn);
      categoryList.appendChild(row);
    });
  }

  function addCategory() {
    const category = newCategoryInput.value.trim();
    if (!category) return;

    categoryStatusLine.textContent = 'Adding…';
    categoryStatusLine.className = 'status-line';

    fetch('/categories/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category }),
    })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'added') {
          categoryStatusLine.textContent = 'Added.';
          categoryStatusLine.className = 'status-line success';
          newCategoryInput.value = '';
          loadCategories();
        } else {
          categoryStatusLine.textContent = data.error || 'Could not add category.';
          categoryStatusLine.className = 'status-line error';
        }
      })
      .catch(err => {
        categoryStatusLine.textContent = 'Error: ' + err.message;
        categoryStatusLine.className = 'status-line error';
      });
  }

  function removeCategory(category) {
    categoryStatusLine.textContent = 'Removing…';
    categoryStatusLine.className = 'status-line';

    fetch('/categories/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category }),
    })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'removed') {
          categoryStatusLine.textContent = 'Removed.';
          categoryStatusLine.className = 'status-line success';
          loadCategories();
        } else {
          categoryStatusLine.textContent = data.error || 'Could not remove category.';
          categoryStatusLine.className = 'status-line error';
        }
      })
      .catch(err => {
        categoryStatusLine.textContent = 'Error: ' + err.message;
        categoryStatusLine.className = 'status-line error';
      });
  }

  newCategoryInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addCategory();
  });

  loadCategories();
</script>
</body>
</html>
